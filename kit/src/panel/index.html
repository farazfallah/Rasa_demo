<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل دمو رسا</title>
<style>
@font-face { font-family: "Vazirmatn"; src: url("/fonts/Vazirmatn.woff2") format("woff2-variations"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #f7f6f2; --card: #fff; --line: #e7e4dc; --ink: #1d2433; --muted: #6b7280;
  --brand: #1f5aa6; --brand-soft: #e8f0fb; --ok: #15803d; --ok-soft: #e7f6ec; --warn: #b45309; --warn-soft: #fdf3e2;
  --bad: #b91c1c; --bad-soft: #fdecec;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12151c; --card: #1a1f29; --line: #2a3140; --ink: #e6e8ee; --muted: #9aa3b2; --brand: #7aa7e8; --brand-soft: #1d2a40; --ok: #5fd28b; --ok-soft: #173024; --warn: #f0b860; --warn-soft: #33270f; --bad: #f08a8a; --bad-soft: #3a1a1a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.8 "Vazirmatn", system-ui, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 20px; margin: 0; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 16px; }
.status b { font-weight: 700; }
.badge { display: inline-block; border-radius: 999px; padding: 0 10px; font-size: 12px; font-weight: 600; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.muted { background: var(--line); color: var(--muted); }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 4px 12px; cursor: pointer; }
button:hover { border-color: var(--brand); }
button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 700; }
.lead { margin-bottom: 12px; }
.lead-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.lead-head h2 { font-size: 16px; margin: 0; }
.meta { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 6px 16px; margin: 10px 0; }
.grid div span { color: var(--muted); font-size: 12px; display: block; }
.msg { background: var(--bg); border-radius: 10px; padding: 8px 12px; margin: 8px 0; white-space: pre-wrap; }
.access { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin: 10px 0; }
.access div { border: 1px dashed var(--line); border-radius: 10px; padding: 6px 10px; }
.access span { display: block; font-size: 12px; color: var(--muted); }
.access code { font: 600 15px/1.6 ui-monospace, monospace; direction: ltr; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
select, input, textarea { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 3px 8px; }
textarea { width: 100%; min-height: 60px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
details { margin-top: 20px; }
pre.log { direction: ltr; text-align: left; font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; max-height: 360px; overflow: auto; white-space: pre-wrap; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>درخواست‌های دمو سامانه رسا</h1>
    <div class="meta" id="demo-url"></div>
  </header>
  <div class="card status" id="status">در حال بارگذاری…</div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <details>
    <summary>گزارش فعالیت کیت</summary>
    <pre class="log" id="log"></pre>
  </details>
</div>
<div class="toast" id="toast"></div>
<script>
const STATUS = {
  pending: ['در انتظار بررسی', 'warn'],
  active: ['دسترسی فعال', 'ok'],
  expired: ['منقضی', 'muted'],
  rejected: ['رد شده', 'bad'],
};
const TABS = [['pending', 'در انتظار'], ['active', 'فعال'], ['expired', 'منقضی'], ['rejected', 'رد شده'], ['all', 'همه']];
let tab = localStorage.getItem('tab') || 'pending';
let state = null;
let editing = false;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fa = (n) => Number(n).toLocaleString('fa-IR');
const date = (iso) => iso ? new Intl.DateTimeFormat('fa-IR-u-ca-persian', { dateStyle: 'medium', timeStyle: 'short', hourCycle: 'h23' }).format(new Date(iso)) : '—';
function ago(iso) {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'همین الان';
  if (m < 60) return `${fa(m)} دقیقه پیش`;
  if (m < 1440) return `${fa(Math.round(m / 60))} ساعت پیش`;
  return `${fa(Math.round(m / 1440))} روز پیش`;
}
function left(iso) {
  const h = Math.round((Date.parse(iso) - Date.now()) / 3600000);
  if (h <= 0) return 'تمام شده';
  return h < 48 ? `${fa(h)} ساعت مانده` : `${fa(Math.round(h / 24))} روز مانده`;
}
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

async function load() {
  const res = await fetch('/panel/api/state', { cache: 'no-store' });
  if (!res.ok) return;
  state = await res.json();
  if (!editing) render();
}

async function act(id, action, body = {}, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  const res = await fetch(id ? `/panel/api/leads/${id}/${action}` : `/panel/api/${action}`, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-panel': '1' },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  toast(res.ok ? 'انجام شد' : data.message || 'خطا');
  await load();
}

function renderStatus() {
  const b = state.build;
  const buildBadge = !b ? ['ساخته نشده', 'warn'] : b.state === 'ok' ? ['آماده', 'ok'] : b.state === 'running' ? ['در حال ساخت', 'warn'] : ['خطا', 'bad'];
  document.getElementById('demo-url').innerHTML = `نسخه نمایشی: <a href="${esc(state.demoUrl)}" target="_blank" dir="ltr">${esc(state.demoUrl)}</a>`;
  document.getElementById('status').innerHTML = `
    <div>مدرسه نمونه: <span class="badge ${buildBadge[1]}">${buildBadge[0]}</span></div>
    ${b?.finishedAt ? `<div class="meta">آخرین ساخت: ${date(b.finishedAt)}</div>` : ''}
    <div class="meta">بازسازی خودکار هر شب ساعت ${fa(state.resetAt.slice(0, 2))}:${fa(state.resetAt.slice(3))}</div>
    ${state.busy ? `<div><span class="badge warn">${esc(state.busy.label)}…</span></div>` : ''}
    ${b?.error ? `<div class="meta" style="color:var(--bad)">${esc(b.error)}</div>` : ''}
    <div style="margin-inline-start:auto"><button onclick="act(null,'rebuild',{},'همه داده‌های دمو پاک و از نو ساخته می‌شود و چند دقیقه در دسترس نیست. ادامه می‌دهید؟')" ${state.busy ? 'disabled' : ''}>بازسازی کامل الان</button></div>`;
}

function renderTabs() {
  const count = (k) => k === 'all' ? state.leads.length : state.leads.filter((l) => l.status === k).length;
  document.getElementById('tabs').innerHTML = TABS.map(([k, label]) =>
    `<button class="${tab === k ? 'active' : ''}" onclick="setTab('${k}')">${label} (${fa(count(k))})</button>`).join('');
}

function setTab(k) {
  tab = k;
  localStorage.setItem('tab', k);
  render();
}

function leadCard(l) {
  const [label, tone] = STATUS[l.status] || [l.status, ''];
  const p = l.provision;
  const prov = !p ? '' : p.state === 'ok' ? '<span class="badge ok">حساب‌ها ساخته شد</span>'
    : p.state === 'running' ? '<span class="badge warn">در حال ساخت حساب‌ها…</span>'
    : `<span class="badge bad" title="${esc(p.error)}">خطا در ساخت حساب‌ها</span>`;
  const u = l.usernames;
  const access = u && (l.status === 'active' || l.status === 'expired') ? `
    <div class="access">
      <div><span>مدیر مدرسه</span><code>${esc(u.admin)}</code></div>
      <div><span>معلم</span><code>${esc(u.teacher)}</code></div>
      <div><span>ولی</span><code>${esc(u.parent)}</code></div>
      <div><span>دانش‌آموز</span><code>${esc(u.student)}</code></div>
      <div><span>رمز (همه حساب‌ها)</span><code>${esc(l.password)}</code></div>
    </div>` : '';
  const days = `<select id="days-${l.id}">${[3, 7, 14, 30].map((d) => `<option value="${d}" ${d === state.leadDays ? 'selected' : ''}>${fa(d)} روز</option>`).join('')}</select>`;
  const buttons = [];
  if (l.status === 'pending') {
    buttons.push(days, `<button class="primary" onclick="act('${l.id}','approve',{days:document.getElementById('days-${l.id}').value})">تأیید و ساخت دسترسی</button>`);
    buttons.push(`<button class="danger" onclick="act('${l.id}','reject',{},'درخواست رد شود؟')">رد</button>`);
  }
  if (l.status === 'active' || l.status === 'expired') {
    buttons.push(`<button class="primary" onclick="copyAccess('${l.id}')">کپی متن دسترسی</button>`);
    buttons.push(days, `<button onclick="act('${l.id}','extend',{days:document.getElementById('days-${l.id}').value})">${l.status === 'expired' ? 'فعال‌سازی دوباره' : 'تمدید'}</button>`);
  }
  if (l.status === 'active') {
    if (p?.state === 'error') buttons.push(`<button onclick="act('${l.id}','retry')">ساخت دوباره حساب‌ها</button>`);
    buttons.push(`<button class="danger" onclick="act('${l.id}','revoke',{},'دسترسی همین الان قطع شود؟')">قطع دسترسی</button>`);
  }
  buttons.push(`<button onclick="editNote('${l.id}')">یادداشت</button>`);
  buttons.push(`<button class="danger" onclick="act('${l.id}','delete',{},'درخواست برای همیشه حذف شود؟')">حذف</button>`);
  return `<div class="card lead">
    <div class="lead-head">
      <h2>${esc(l.name)}</h2>
      <span class="badge ${tone}">${label}</span>
      ${l.code ? `<span class="badge muted">کد ${fa(l.code)}</span>` : ''}
      ${prov}
      <span class="meta" style="margin-inline-start:auto" title="${date(l.createdAt)}">${ago(l.createdAt)}</span>
    </div>
    <div class="grid">
      <div><span>مدرسه</span>${esc(l.school)}</div>
      <div><span>سمت</span>${esc(l.role) || '—'}</div>
      <div><span>موبایل</span><a href="tel:${esc(l.mobile)}" dir="ltr">${esc(l.mobile)}</a></div>
      <div><span>شهر</span>${esc(l.city) || '—'}</div>
      <div><span>تعداد دانش‌آموز</span>${esc(l.students) || '—'}</div>
      ${l.expiresAt ? `<div><span>اعتبار تا</span>${date(l.expiresAt)}${l.status === 'active' ? ` <span class="meta">(${left(l.expiresAt)})</span>` : ''}</div>` : ''}
    </div>
    ${l.message ? `<div class="msg">${esc(l.message)}</div>` : ''}
    ${l.note ? `<div class="msg" style="border-inline-start:3px solid var(--brand)"><b>یادداشت: </b>${esc(l.note)}</div>` : ''}
    <div id="note-${l.id}"></div>
    ${access}
    <div class="actions">${buttons.join('')}</div>
  </div>`;
}

function render() {
  if (!state) return;
  renderStatus();
  renderTabs();
  const leads = state.leads.filter((l) => tab === 'all' || l.status === tab);
  document.getElementById('list').innerHTML = leads.length ? leads.map(leadCard).join('') : '<div class="empty">موردی نیست.</div>';
  document.getElementById('log').textContent = state.log.join('\n');
}

function editNote(id) {
  const l = state.leads.find((x) => x.id === id);
  editing = true;
  document.getElementById(`note-${id}`).innerHTML = `<textarea id="note-text-${id}" placeholder="مثلا: تماس گرفته شد، جلسه معرفی هفته بعد">${esc(l.note || '')}</textarea>
    <div class="actions"><button class="primary" onclick="saveNote('${id}')">ذخیره یادداشت</button><button onclick="editing=false;render()">انصراف</button></div>`;
}

async function saveNote(id) {
  editing = false;
  await act(id, 'note', { note: document.getElementById(`note-text-${id}`).value });
}

async function copyAccess(id) {
  const l = state.leads.find((x) => x.id === id);
  try {
    await navigator.clipboard.writeText(l.accessText);
    toast('متن دسترسی کپی شد');
  } catch {
    prompt('متن دسترسی را کپی کنید:', l.accessText);
  }
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
